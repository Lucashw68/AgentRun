[package]
name = "agentrun"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Local development process manager for humans and agents, with a stdio-only MCP server"
license = "MIT"
readme = "README.md"
default-run = "agentrun"
include = ["src/**/*.rs", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "examples/config.json", "scripts/*.py", "docs/*.md", ".github/workflows/*.yml"]

[[bin]]
name = "agentrun"
path = "src/bin/agentrun.rs"

[[bin]]
name = "agentrun-mcp"
path = "src/bin/agentrun-mcp.rs"

[[bin]]
name = "agentrun-log"
path = "src/bin/agentrun-log.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rmcp = { version = "3.3", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
